<!--
  ПОЛНЫЙ ОТЗЫВ — Александра — контент для попапа (Zero Block) в Тильде.
  ГДЕ ИСПОЛЬЗОВАТЬ: вставьте в ОТДЕЛЬНЫЙ Zero Block с типом "попап", алиас откройте в
  настройках этого попапа и впишите ровно тот, что указан в кнопке на карточке отзыва
  на основной странице (href="#popup:alexandra") — тогда клик по кнопке "Открыть полный отзыв"
  откроет именно этот попап.
  Тип медиа: аудиоотзыв + скриншоты переписки.

  ПРО АУДИО: голосовое (.ogg) я раньше встраивал прямо в код как data-URI — получилось около
  200 000 символов одной строкой, и это не давало вставить код в Тильду. Вы прислали ссылку на
  трек на Whyp (whyp.it) вида "whyp.it/tracks/...?token=...", НО это ссылка на страницу самого
  сайта Whyp (со всей навигацией), а не на отдельный компактный плеер — поэтому во фрейме
  показывался весь сайт, а не просто проигрыватель. У Whyp есть отдельный embed-формат вида
  "whyp.it/embeds/track/ID" именно для встраивания только плеера — ниже стоит src, собранный по
  этому шаблону из вашей ссылки. Проверить его сам не могу: whyp.it целиком заблокирован для
  исходящих запросов из этой песочницы (и обычная ссылка на трек, и embed — оба недоступны мне
  для просмотра). Если после вставки в Тильду там всё ещё показывается сайт целиком, а не плеер —
  на странице трека на whyp.it найдите кнопку "Share" → "Embed" (в доке Whyp это описано именно
  так), скопируйте готовый iframe-код оттуда целиком и пришлите мне — вставлю точный код вместо
  этого. Также можно проверить, есть ли у трека прямая ссылка на скачивание файла (Whyp это
  поддерживает) — тогда можно вообще без iframe, обычным <audio>, как было раньше.
-->
<style>
  .kr-review * { box-sizing: border-box; }
  .kr-review {
    --kr-bg: #F4F6FB; --kr-ink: #0B1730; --kr-navy: #16295E; --kr-navy-deep: #0A1638;
    --kr-navy-soft: #E6EAF6; --kr-red: #D0263B; --kr-red-deep: #A81F2C;
    --kr-muted: #4B5670; --kr-muted2: #6B7690;
    font-family: 'Golos Text', system-ui, -apple-system, sans-serif;
    background: #fff; color: var(--kr-ink); -webkit-font-smoothing: antialiased;
    max-width: 640px; margin: 0 auto; padding: 28px 20px 36px;
  }
  @import url('https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap');
  .kr-review-name { font-size: 24px; font-weight: 800; line-height: 1.15; letter-spacing: -0.01em; }
  @media (min-width: 640px) { .kr-review-name { font-size: 28px; } }
  .kr-review-badges { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
  .kr-review-badge { background: var(--kr-red); color: #fff; border-radius: 999px; padding: 6px 14px; font-size: 12px; font-weight: 700; }
  .kr-review-badge.kr-navy { background: var(--kr-navy); }
  .kr-review-text { margin-top: 18px; font-size: 15px; line-height: 1.6; color: #1e293b; }
  .kr-review-text p + p { margin-top: 10px; }
  .kr-review-media { margin-top: 22px; }
  .kr-review-media-label { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--kr-muted2); margin-bottom: 10px; }
  /* audio — плеер Whyp во фрейме */
  .kr-review-audio { background: var(--kr-navy-soft); border-radius: 16px; padding: 10px; }
  .kr-review-audio iframe { width: 100%; height: 180px; border: 0; border-radius: 10px; display: block; background: #fff; }
  /* screenshots */
  .kr-review-shots { margin-top: 18px; display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .kr-review-shots img { flex: none; width: 160px; aspect-ratio: 3/5.5; object-fit: cover; border-radius: 35px; background: var(--kr-bg); box-shadow: 0 10px 20px -10px rgba(22,41,94,.25); cursor: zoom-in; }
  .kr-review-cta { margin-top: 28px; text-align: center; }
  .kr-review-cta-text { font-size: 13px; color: var(--kr-muted); margin-bottom: 12px; }
  .kr-review-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--kr-red); color: #fff; border-radius: 999px; height: 50px; padding: 0 30px;
    font-weight: 700; font-size: 14.5px; text-decoration: none; border: none; cursor: pointer;
    transition: background .15s ease;
  }
  .kr-review-btn:hover { background: var(--kr-red-deep); }
  /* лайтбокс — увеличенный просмотр скриншота по клику */
  .kr-lightbox {
    position: fixed; inset: 0; background: rgba(11,23,48,.92); display: none;
    align-items: center; justify-content: center; z-index: 999; padding: 24px;
  }
  .kr-lightbox.kr-open { display: flex; }
  .kr-lightbox img { max-width: 100%; max-height: 100%; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .kr-lightbox-close {
    position: absolute; top: 16px; right: 16px; width: 40px; height: 40px; border-radius: 999px;
    background: rgba(255,255,255,.15); color: #fff; display: grid; place-items: center;
    font-size: 22px; line-height: 1; cursor: pointer; border: none;
  }
</style>

<div class="kr-review">
  <div class="kr-review-name">Александра → 4 престижных вуза</div>
  <div class="kr-review-badges">
    <span class="kr-review-badge">4 из 4 вузов</span>
    <span class="kr-review-badge kr-navy">престижные вузы</span>
  </div>

  <div class="kr-review-text">
    <p>Александра подала документы в 4 университета Кореи — и поступила во все четыре.</p>
    <p>Каждый из них входит в число престижных университетов страны.</p>
  </div>

  <div class="kr-review-media">
    <div class="kr-review-media-label">Аудиоотзыв</div>
    <!-- ПРОВЕРЬТЕ: это embed-формат Whyp (whyp.it/embeds/track/ID), а не обычная ссылка на трек —
         обычная показывала весь сайт целиком, а не только плеер. Если и так покажется весь сайт —
         возьмите готовый iframe-код через "Share → Embed" на странице трека на whyp.it и пришлите,
         вставлю точный вариант -->
    <div class="kr-review-audio">
      <iframe src="https://whyp.it/embeds/track/otzyv-OLz5TKQRdTl8?token=fRgeDE5tolNa" title="Аудиоотзыв Александры" allow="autoplay" loading="lazy"></iframe>
    </div>
  </div>

  <div class="kr-review-media">
    <div class="kr-review-media-label">Скриншоты переписки</div>
    <div class="kr-review-shots">
      <img src="https://static.tildacdn.ink/tild6632-6363-4231-a362-303964366432/8db1c7e8-2bc3-4765-b.JPG" alt="Скриншот переписки Александры">
      <img src="https://static.tildacdn.ink/tild3237-6233-4863-a364-336666653239/a7bc1be4-0927-4cea-9.JPG" alt="Скриншот переписки Александры">
      <img src="https://static.tildacdn.ink/tild3730-3064-4732-b135-373038316134/1b48272e-6273-4aa6-b.JPG" alt="Скриншот переписки Александры">
    </div>
  </div>

  <div class="kr-review-cta">
    <div class="kr-review-cta-text">Хотите так же — со скидкой и без лишних нервов?</div>
    <a href="#popup1" class="kr-review-btn">Оставить заявку</a>
  </div>
</div>

<div class="kr-lightbox" id="kr-lightbox-alexandra">
  <button class="kr-lightbox-close" type="button" aria-label="Закрыть">×</button>
  <img src="" alt="">
</div>

<script>
(function(){
  var lightbox = document.getElementById('kr-lightbox-alexandra');
  if (!lightbox) return;
  var lightboxImg = lightbox.querySelector('img');
  document.querySelectorAll('.kr-review-shots img').forEach(function(img){
    img.addEventListener('click', function(){
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;
      lightbox.classList.add('kr-open');
    });
  });
  lightbox.addEventListener('click', function(){
    lightbox.classList.remove('kr-open');
    lightboxImg.src = '';
  });
})();
</script>
